[package]
name = "genesis-node"
version = "0.1.0"
edition = "2021"

[features]
default = ["titan", "text", "vision", "audio", "rl", "robotics", "fusion"]
titan = ["genesis-core/titan"]
text = ["genesis-core/text"]
vision = ["genesis-core/vision"]
audio = ["genesis-core/audio"]
rl = ["genesis-core/rl"]
robotics = ["genesis-core/robotics"]
fusion = ["genesis-core/fusion"]
cpp = ["genesis-compute/cpp"]
cuda = ["genesis-compute/cuda"]

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
genesis-core = { path = "../genesis-core" }
genesis-compute = { path = "../genesis-compute" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
bincode = { workspace = true }
rayon = "1.7"
rand = { workspace = true }
