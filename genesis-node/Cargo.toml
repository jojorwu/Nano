[package]
name = "genesis-node"
version = "0.1.0"
edition = "2021"

[features]
default = ["titan", "text", "vision"]
titan = ["genesis-core/titan"]
text = ["genesis-core/text"]
vision = ["genesis-core/vision"]

[dependencies]
genesis-core = { path = "../genesis-core" }
genesis-compute = { path = "../genesis-compute" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
