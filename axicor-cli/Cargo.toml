[package]
name = "axicor-cli"
version = "0.1.0"
edition = "2021"

[features]
default = ["titan", "text", "vision"]
titan = ["genesis-baker/titan", "genesis-node/titan", "genesis-core/titan"]
text = ["genesis-baker/text", "genesis-node/text", "genesis-core/text"]
vision = ["genesis-baker/vision", "genesis-node/vision", "genesis-core/vision"]

[dependencies]
genesis-core = { path = "../genesis-core" }
genesis-baker = { path = "../genesis-baker" }
genesis-node = { path = "../genesis-node" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
toml = "0.8"
image = "0.24"
