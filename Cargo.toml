[workspace]
members = [
    "genesis-core",
    "genesis-baker",
    "genesis-compute",
    "genesis-node",
    "nano-cli",
]
resolver = "2"

[workspace.dependencies]
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
bincode = "1.3"
rand = "0.8"
toml = "0.8"
bytemuck = { version = "1.13", features = ["derive"] }
pollster = "0.3"
wgpu = "0.19"
clap = { version = "4.0", features = ["derive"] }
image = "0.24"
